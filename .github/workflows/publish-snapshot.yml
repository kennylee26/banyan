name: Publish Snapshot to Maven Central

on:
  push:
    branches: [main]
  workflow_dispatch:

# 所需 GitHub Secrets（Settings -> Secrets and variables -> Actions）:
#   CENTRAL_TOKEN_USERNAME  Central Portal 生成的 User Token 用户名
#   CENTRAL_TOKEN_PASSWORD  Central Portal 生成的 User Token 密码
#   GPG_PRIVATE_KEY         导出为 ASCII armor 的 GPG 私钥（gpg --armor --export-secret-keys <KEY_ID>）
#   GPG_PASSPHRASE          该私钥的口令

jobs:
  publish:
    # 防止在 dev 等分支上手动触发 workflow_dispatch 时误发快照
    if: github.ref == 'refs/heads/main'
    # 固定 22.04：ubuntu-latest(24.04) 上 flapdoodle 内嵌 Mongo 启动失败，先回退到较旧 LTS 观察
    runs-on: ubuntu-22.04
    env:
      # maven-gpg-plugin 默认读取 MAVEN_GPG_PASSPHRASE，名字不可随意改
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 and Maven settings
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central-portal
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build and publish snapshot
        run: mvn --batch-mode -Prelease clean deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
