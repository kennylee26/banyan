# banyan-commons-spring 配置参考
# 本文件是显式配置参考，不参与构建、不打入 jar；所有值均为框架默认值，可直接拷贝后按需修改。
# 对应 java config：仅 @ConditionalOnProperty 条件注解（无 *Properties 类）
#   JsonAutoConfiguration（banyan-commons-spring/src/main/java/cn/kennylee/banyan/commons/spring/json/）
#   provider 的 havingValue="jackson" 表示只有显式写 jackson（或依赖 matchIfMissing）才注册默认 JsonCodec bean
# 全仓总表见 ../CONFIGURATION.md
banyan:
  json:
    enabled: true          # 总开关；false 时不注册 JsonCodec 默认实现（仅 @ConditionalOnProperty，matchIfMissing=true；无 Properties 字段）
    provider: jackson      # 选择实现；havingValue="jackson"、matchIfMissing=true，仅 @ConditionalOnProperty（无 Properties 字段）
