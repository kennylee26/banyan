name: Diagnose Embedded Mongo on ubuntu-latest

# 临时诊断用：确认 flapdoodle 内嵌 Mongo 在 ubuntu-latest(24.04) 上启动失败的
# 真实 Caused by（缺库 / 包选错 / 下载超时）。不发布、不签名、不影响发布流程。
# 查清并迁回 ubuntu-latest 后删除本文件。
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Print OS and library info
        run: |
          echo "=== /etc/os-release ==="
          cat /etc/os-release
          echo "=== openssl ==="
          openssl version
          echo "=== libssl/libcrypto present ==="
          ls -l /usr/lib/x86_64-linux-gnu/libssl.so* /usr/lib/x86_64-linux-gnu/libcrypto.so* 2>&1 || true
          echo "=== runner image ==="
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"

      - name: Run embedded Mongo tests (verbose, no publish)
        # 只跑 mongodb 模块，避开其它模块；-am 带上上游依赖
        run: mvn --batch-mode -pl banyan-data/banyan-data-mongodb-springdata -am test -DskipTests=false
        env:
          # 让 flapdoodle / Spring 打印更完整的诊断
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.defaultLogLevel=debug

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongo-24-diagnosis
          path: |
            **/target/surefire-reports/**
            /home/runner/.embedmongo/**
          if-no-files-found: warn
